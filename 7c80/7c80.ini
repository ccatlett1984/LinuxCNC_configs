# This file was created with the Mesa Configuration Tool on Jan 10 2026 18:32:25
# Changes to most things are ok and will be read by the Configuration Tool

[MESA]
VERSION = 3.0.0
BOARD_NAME = 7c80

[EMC]
# VERSION is used by the LinuxCNC startup script
VERSION = 1.1
EMC_VERSION = 2.9.7
MACHINE = 7c80
DEBUG = 0x00000000

[HM2]
DRIVER = hm2_spix

[DISPLAY]
DISPLAY = axis
PROGRAM_PREFIX = ~/linuxcnc/nc_files
INTRO_GRAPHIC = emc2.gif
INTRO_TIME = 1
OPEN_FILE = ""
MAX_FEED_OVERRIDE = 1.2
DEFAULT_LINEAR_VELOCITY = 1.5
MAX_LINEAR_VELOCITY = 25.0
INCREMENTS = 0.1mm,0.5mm,1mm,5mm,10mm
EDITOR = gedit
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = COMMANDED

[RS274NGC]
PARAMETER_FILE = parameters.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[HAL]
HALFILE = main.hal
#HALFILE = io.hal

[TRAJ]
COORDINATES = XYZ
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
MAX_LINEAR_VELOCITY = 150.0

[KINS]
KINEMATICS = trivkins coordinates=XYZ
JOINTS = 3

[EMCIO]
EMCIO = iov2
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

[INPUTS]
# DO NOT change the inputs they are used by the configuration tool
INPUT_0_0 = Digital 0
INPUT_INVERT_0_0 = True
INPUT_SLOW_0_0 = False
INPUT_0_1 = Digital 1
INPUT_INVERT_0_1 = False
INPUT_SLOW_0_1 = True
INPUT_0_13 = Joint 2 Plus Home
INPUT_INVERT_0_13 = True
INPUT_SLOW_0_13 = False
INPUT_0_14 = Joint 1 Plus Home
INPUT_INVERT_0_14 = False
INPUT_SLOW_0_14 = False
INPUT_0_15 = Joint 0 Minus Home
INPUT_INVERT_0_15 = False
INPUT_SLOW_0_15 = False
INPUT_0_22 = E Stop 0
INPUT_INVERT_0_22 = True
INPUT_SLOW_0_22 = False
INPUT_0_23 = Probe Input
INPUT_INVERT_0_23 = False
INPUT_SLOW_0_23 = False

[OUTPUTS]
# DO NOT change the outputs they are used by the configuration tool
OUTPUT_0_0 = Coolant Flood
OUTPUT_INVERT_0_0 = False
OUTPUT_0_7 = Digital Out 1
OUTPUT_INVERT_0_7 = False

[OPTIONS]
# DO NOT change the options they are used by the configuration tool
LOAD_CONFIG = False
MANUAL_TOOL_CHANGE = True
CUSTOM_HAL = False
POST_GUI_HAL = False
SHUTDOWN_HAL = False
HALUI = False
PYVCP = False
BACKUP = False
